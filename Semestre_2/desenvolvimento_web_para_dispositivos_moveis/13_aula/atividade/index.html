<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
    .input_form {
        @apply w-full border border-gray-300 rounded-md p-2.5 text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all;
    }
    .label_form {
        @apply text-sm font-medium text-gray-700 mb-1.5;
    }
</style>
<head>
<body class="flex min-h-screen flex-col md:h-screen md:flex-row">
    <div class="order-1 md-order-2 flex min-h-screen w-full flex-col items-center justify-center bg-white px-6 py-10 sm:px-8 md:w-1/2 md:py-0">
        <form class="w-full max-w-md space-y-4" method="post">
            <div class="flex flex-col">
                <label class="label_form" for="name">Nome</label>
                <input class="input_form" type="text" id="name" placeholder="Seu nome completo" required>
            </div>
            <div class="flex flex-col">
                <label class="label_form" for="email">Email</label>
                <input class="input_form" type="email" id="email" placeholder="Seu email" required>
            </div>
            <div class="flex flex-col">
                <label class="label_form" for="password">Senha</label>
                <input class="input_form" type="password" id="password" placeholder="Digite a senha desejada"
                    required>
            </div>
            <div class="flex flex-col">
                <label class="label_form" for="confirm-password">Confirmar senha</label>
                <input class="input_form" type="password" id="confirm-password"
                    placeholder="Digite a senha novamente" required>
                <p class="text-xs text-bold mt-1.5 text-center">A senha deve conter: mais de 7 caracteres, letras e
                    números</p>
            </div>
            <div class="pt-2 mt-15">
                <label for="checkbox"
                    class="flex items-start gap-2.5 text-xs text-gray-600 cursor-pointer select-none leading-relaxed">
                    <input type="checkbox" name="checkbox" id="checkbox"
                        class="mt-0.5 h-4 w-4 shrink-0 rounded border-gray-300 text-black focus:ring-black"
                        required>
                    <span>
                        Estou ciente e concordo com os
                        <a href="#" class="underline font-medium hover:text-black">Termos de Uso</a> e com a
                        <a href="#" class="underline font-medium hover:text-black">Políticas</a> da Hotmart.
                    </span>
                </label>
            </div>
            <div class="pt-2">
                <button
                    class="w-full bg-black text-white font-medium py-3 rounded-lg hover:bg-gray-900 transition-colors cursor-pointer text-sm">
                    Criar conta
                </button>
            </div>
        </form>
    </div>
    <div class="order-2 md-order-1 flex h-64 w-full sm:h-80 md:h-full md:w-1/2">
        <img class="h-full w-full object-cover" src="../../img/space.jpg" alt="">
    </div>
</body>
</html>
